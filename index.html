<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pusat Game Matematika</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Nunito,Arial,sans-serif;color:#2b2d42;min-height:100vh;
    background:linear-gradient(135deg,#ffd36e,#ff8fab);padding:32px 16px;
  }
  header{text-align:center;margin-bottom:28px}
  h1{font-size:2.2rem;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15)}
  header p{color:#fff;margin-top:6px;font-weight:600}
  .grid{
    max-width:900px;margin:0 auto;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  }
  .game{
    background:#fff;border-radius:24px;padding:24px;text-decoration:none;color:inherit;
    box-shadow:0 10px 24px rgba(0,0,0,.15);transition:transform .15s;display:block;
  }
  .game:hover{transform:translateY(-4px)}
  .icon{font-size:3rem}
  .game h2{margin:10px 0 6px;color:#6c5ce7}
  .game p{color:#8d99ae;font-size:.95rem}
  .play{
    display:inline-block;margin-top:14px;background:#6c5ce7;color:#fff;
    padding:8px 18px;border-radius:999px;font-weight:700;
  }
  .soon{opacity:.55;pointer-events:none}
  .soon .play{background:#b2bec3}
  footer{text-align:center;color:#fff;margin-top:32px;font-size:.9rem}
</style>
</head>
<body>
  <header>
    <h1>🎮 Pusat Game Matematika</h1>
    <p>Belajar sambil bermain!</p>
  </header>

  <main class="grid">
    <a class="game" href="game-perkalian.html">
      <div class="icon">✖️</div>
      <h2>Jagoan Perkalian</h2>
      <p>Latihan perkalian dengan hasil sampai 60. Ada 3 level dan mode lawan waktu.</p>
      <span class="play">Main ▶</span>
    </a>

    <!-- Contoh slot game berikutnya: ganti href, ikon, judul, dan hapus class "soon" -->
    <a class="game soon" href="#">
      <div class="icon">➗</div>
      <h2>Segera Hadir</h2>
      <p>Game berikutnya akan muncul di sini.</p>
      <span class="play">Segera</span>
    </a>
  </main>

  <footer>Dibuat dengan ❤️</footer>
</body>
</html>
