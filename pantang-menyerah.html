<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Pantang Menyerah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Tema buku tulis bergaris + lencana. Satu permainan = satu "lencana" di peta. */
:root{
  --paper:#fffaf0; --rule:#f1e3c8; --card:#fff; --ink:#2a2f45; --soft:#66708a; --line:#eadfca;
  --orange:#f08a24; --orange-d:#c06a12; --red:#e2504c; --teal:#1f9e8f; --blue:#3b82d6; --purple:#8a55c9; --green:#3e9b4f; --pink:#e04b8c;
  --good:#2f9e57; --good-bg:#ddf5e5; --bad:#d63a2f; --bad-bg:#fce1de; --sun:#ffc23d;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 33px)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;padding:12px 14px 40px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.hidden{display:none!important}

.bar{display:flex;align-items:center;gap:10px}
.home{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--card);text-decoration:none;font-size:22px;box-shadow:0 3px 0 var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand .logo{width:46px;height:46px;border-radius:14px;background:var(--orange);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 var(--orange-d);flex-shrink:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1;margin:0}
.brand small{display:block;font-weight:700;color:var(--soft);font-size:.8rem;margin-top:3px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{border:0;background:var(--card);width:42px;height:42px;border-radius:50%;font-size:20px;box-shadow:0 3px 0 var(--line);flex-shrink:0}

.hello{background:var(--card);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 0 var(--line)}
.hello .kids{font-size:46px;line-height:1;flex-shrink:0}
.hello h2{font-family:var(--display);font-size:1.4rem;margin:0;line-height:1.15;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--soft);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{border:0;background:var(--card);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:0 5px 0 var(--line);transition:transform .15s}
.cell:hover{transform:translateY(-3px)}
.cell .tag{align-self:flex-start;font-family:var(--display);font-weight:800;color:#fff;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:1rem;line-height:1}
.cell .ic{font-size:40px;line-height:1.1;margin-top:-6px}
.cell b{font-family:var(--display);font-size:1.05rem;line-height:1.1}
.cell span.id{font-size:.76rem;color:var(--soft);font-weight:700;line-height:1.2}
.stars{letter-spacing:2px;font-size:1rem;color:#dcd6ca}
.stars .on{color:var(--sun)}
.hint{font-size:.88rem;color:var(--soft);font-weight:700;text-align:center;margin:0}

.head{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);flex-shrink:0}
.head .tag{font-family:var(--display);font-weight:800;color:#fff;min-width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.3rem;flex-shrink:0}
.head h2{font-family:var(--display);font-size:1.3rem;margin:0;line-height:1.1}
.head p{margin:2px 0 0;font-size:.86rem;color:var(--soft);font-weight:700;line-height:1.3}
.head .t{flex:1;min-width:0}
.progress{height:12px;background:var(--card);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .35s}
.plate{background:var(--card);border-radius:24px;padding:20px 16px;box-shadow:0 7px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:16px}
.big{font-size:84px;line-height:1}
.prompt{font-family:var(--display);font-weight:600;font-size:1.35rem;text-align:center;line-height:1.35;margin:0;text-wrap:balance}
.prompt b{color:var(--orange-d)}
.sentence{font-family:var(--display);font-weight:800;font-size:1.45rem;text-align:center;line-height:1.35;background:#fff5e3;border-radius:16px;padding:12px 16px;margin:0;width:100%;max-width:560px}
.blank{display:inline-block;min-width:60px;border-bottom:4px dashed var(--sun);color:var(--teal);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.opts.one{grid-template-columns:1fr}
.opt{border:3px solid #ebe5d8;background:var(--card);border-radius:16px;padding:13px 12px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 #ebe5d8;min-width:0;line-height:1.3}
.opts.one .opt{text-align:left;font-size:1.02rem;padding:12px 16px}
.opt.big2{font-family:var(--display);font-size:1.9rem;padding:8px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good);color:#1e6b3a}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);color:#9b2a22;animation:shake .35s}
.opt:disabled{cursor:default}
.cheer{min-height:1.5em;font-family:var(--display);font-weight:800;font-size:1.12rem;color:var(--good);margin:0;text-align:center;line-height:1.35}
.cheer.oops{color:var(--bad)}
.tip{font-size:.92rem;color:#7a5410;font-weight:800;text-align:center;margin:0;background:#fff3d6;border-radius:12px;padding:8px 12px;line-height:1.4}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .4s ease-out}

/* hiperbola benar/salah */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px}
.tfb{border:0;border-radius:18px;padding:16px 8px;font-family:var(--display);font-weight:800;font-size:1.3rem;color:#fff;line-height:1.15}
.tfb small{display:block;font-family:var(--body);font-size:.8rem;opacity:.9}
.tfb.yes{background:var(--pink);box-shadow:0 5px 0 #a8326a}
.tfb.no{background:var(--teal);box-shadow:0 5px 0 #157066}
.tfb:disabled{opacity:.5}
mark{background:#ffe08a;border-radius:6px;padding:0 3px}

/* komputer */
.pc{width:100%;max-width:420px}
.pc .part{cursor:pointer;transition:filter .15s}
.pc .part:hover{filter:drop-shadow(0 0 4px #3b82d6)}
.pc .part.hl{filter:drop-shadow(0 0 6px #ffc23d) drop-shadow(0 0 4px #ffc23d)}
.pc .part.ok{filter:drop-shadow(0 0 6px #2f9e57) drop-shadow(0 0 4px #2f9e57)}
.pc .part.no{animation:shake .35s}
.lbl{font-family:var(--display);font-weight:800;font-size:13px;fill:#2a2f45}

/* jodohkan */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px 14px;width:100%;max-width:600px}
.col{display:flex;flex-direction:column;gap:10px}
.mcard{border:3px solid #ebe5d8;background:var(--card);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.98rem;box-shadow:0 4px 0 #ebe5d8;padding:6px 10px;line-height:1.25;text-align:center}
.mcard.word{font-family:var(--display);font-size:1.15rem;color:var(--orange-d)}
.mcard.sel{border-color:var(--blue);box-shadow:0 4px 0 var(--blue);transform:translateY(-2px)}
.mcard.done{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good);color:#1e6b3a;cursor:default}
.mcard.wrong{animation:shake .35s;border-color:var(--bad)}

/* bacaan */
.story{width:100%;max-width:600px;background:#fff5e3;border-radius:18px;padding:14px 16px;border-left:6px solid var(--orange)}
.story summary{font-family:var(--display);font-weight:800;font-size:1.15rem;cursor:pointer;color:var(--orange-d);display:flex;align-items:center;gap:8px;justify-content:space-between}
.story p{margin:8px 0 0;line-height:1.7;font-weight:700;font-size:1.05rem}
.readbtn{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 #2a62a8;flex-shrink:0}

/* susun cerita */
.slots{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px}
.slot{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:stretch}
.slot .k{border-radius:14px;color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:1.05rem}
.slot .v{border:3px dashed #e3d6bd;border-radius:14px;min-height:62px;padding:10px 12px;font-weight:800;line-height:1.4;background:#fffdf8;display:flex;align-items:center}
.slot .v.filled{border-style:solid;border-color:#c9b896;background:#fff;cursor:pointer}
.slot .v.good{border-color:var(--good);background:var(--good-bg)}
.slot .v.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px}
.scard{border:0;background:var(--sun);color:#4a3500;border-radius:14px;padding:12px 14px;font-weight:800;text-align:left;line-height:1.4;box-shadow:0 4px 0 #c9921a}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:1.05rem;background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
.btn.ghost{background:#f2eee6;color:var(--ink);box-shadow:0 4px 0 #ddd5c4}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #157066}
.btn:disabled{opacity:.45;cursor:default}

.result{text-align:center}
.result .big-stars{font-size:62px;letter-spacing:6px;color:#dcd6ca}
.result .big-stars .on{color:var(--sun);display:inline-block;animation:pop .5s both}
.result h2{font-family:var(--display);font-size:2rem;margin:0}
.result p{margin:0;color:var(--soft);font-weight:700}
canvas#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:5}

@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .prompt{font-size:1.18rem}.sentence{font-size:1.22rem}
  .brand h1{font-size:1.15rem}.brand .long{display:none}.brand small{display:none}.pill{padding:6px 9px}
  .match{grid-template-columns:1fr 1.5fr}.mcard{font-size:.88rem}.mcard.word{font-size:1rem}
  .slot{grid-template-columns:64px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function tone(f,d,t='sine',when=0,vol=.18){
  if(muted)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;
    const s=actx.currentTime+when;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g).connect(actx.destination);o.start(s);o.stop(s+d)}catch(e){}
}

}

  return shuffle([...a,...b]);
}
function genPC(){

  const mcs=sample(PC_MC,2).map(([p,a,o])=>({type:'mc',prompt:p,options:shuffle(o),answer:a}));
  return shuffle([...taps,...names,...mcs]);
}
function genHyper(){return [...sample(HYPER.filter(h=>h[1]),5),...sample(HYPER.filter(h=>!h[1]),5)].sort(()=>Math.random()-.5).map(([s,y])=>({type:'hyper',s,y}))}

}
function bindBack(){$('#back').onclick=()=>{sfx.tap();renderMap()}}
function setProg(){const p=$('.progress i');if(p)p.style.width=Math.round(S.steps/S.total*100)+'%'}
function cheer(t,ok){const c=$('#cheer');if(!c)return;c.className='cheer '+(ok?'pop':'oops');c.textContent=t}
function renderQ(){const q=S.qs[S.qi];({mc:renderMC,pc:renderPC,hyper:renderHyper,match:renderMatch,story:renderStory})[q.type](q)}
function next(){S.qi++;if(S.qi>=S.qs.length)finish();else renderQ()}

function renderMC(q){
  const long=q.options.some(o=>o.length>14);
  view.innerHTML=header()+`<section class="plate">
    ${q.read?`<details class="story" ${q.first||window.innerWidth>640?'open':''}><summary>📖 ${q.read.t} <button class="readbtn" id="readbtn">🔊 Bacakan</button></summary><p>${q.read.p}</p></details>`:''}
    ${q.pic||''}
    ${q.sentence?`<p class="sentence">${q.sentence}</p>`:''}
    <p class="prompt">${q.prompt}</p>
    ${optsHTML(q.options,long,q.big)}
    <p class="cheer" id="cheer" aria-live="polite"></p></section>`;
  bindBack();
  const rb=$('#readbtn');if(rb)rb.onclick=e=>{e.preventDefault();e.stopPropagation();read(q.read.p)};
  $$('.opt').forEach(b=>b.onclick=()=>{
    const v=q.options[+b.dataset.i];
    if(v===q.answer){
      b.classList.add('right');$$('.opt').forEach(x=>x.disabled=true);sfx.good();
      if(q.fill){const bl=$('#blank');bl.textContent=q.fill;bl.classList.add('pop')}
      cheer(`${rnd(PRAISE)} ${q.explain||''}`,true);step();later(next,q.explain?2300:1500);
    }else{b.classList.add('wrong');b.disabled=true;S.miss++;sfx.bad();cheer(q.explain?`Coba lagi! 💡 ${q.explain}`:'Coba lagi! Kamu pasti bisa 💪',false)}
  });
}

  bindBack();
  const part=n=>$(`.part[data-part="${n}"]`);
  let done=false;
  const win=()=>{done=true;part(q.answer).classList.add('ok');sfx.good();step();
    cheer(`${rnd(PRAISE)} Itu ${PCNAME[q.answer]}.`,true);later(next,1500)};
  if(q.mode==='name'){
    part(q.answer).classList.add('hl');
    $$('.part').forEach(p=>p.style.pointerEvents='none');
    $$('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;const v=names[+b.dataset.i];
      if(v===q.answer){b.classList.add('right');$$('.opt').forEach(x=>x.disabled=true);part(q.answer).classList.remove('hl');win()}
      else{b.classList.add('wrong');b.disabled=true;S.miss++;sfx.bad();cheer('Coba lagi! Lihat bagian yang menyala.',false)}
    });
  }else{
    $$('.part').forEach(p=>p.onclick=()=>{
      if(done)return;const n=p.dataset.part;
      if(n===q.answer)win();
      else{S.miss++;sfx.bad();p.classList.remove('no');void p.getBBox();p.classList.add('no');cheer(`Itu ${PCNAME[n]}. Coba lagi!`,false)}
    });
  }
}

/* hiperbola atau bukan */
function renderHyper(q){
  const plain=q.s.replace(/<\/?mark>/g,'');
  view.innerHTML=header()+`<section class="plate">
    <div class="big pop">🎈</div>
    <p class="sentence" id="sen">${plain}</p>
    <p class="prompt">Apakah kalimat ini majas hiperbola?</p>
    <div class="tf"><button class="tfb yes" data-v="1">✓ Hiperbola<small>melebih-lebihkan</small></button><button class="tfb no" data-v="0">✗ Bukan<small>kalimat biasa</small></button></div>
    <p class="cheer" id="cheer" aria-live="polite"></p></section>`;
  bindBack();let tries=0;
  $$('.tfb').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v;
    if(v===q.y){
      $$('.tfb').forEach(x=>x.disabled=true);sfx.good();step();
      if(q.y)$('#sen').innerHTML=q.s;
      cheer(q.y?`${rnd(PRAISE)} Bagian yang berlebihan sudah ditandai kuning.`:`${rnd(PRAISE)} Kalimat ini biasa saja, tidak berlebihan.`,true);
      later(next,q.y?2300:1600);
    }else{
      S.miss++;tries++;sfx.bad();b.disabled=true;
      cheer(q.y?'Coba lagi! Apakah hal itu benar-benar bisa terjadi?':'Coba lagi! Kalimat ini menceritakan hal biasa.',false);
    }
  });
}

/* jodohkan */
function renderMatch(q){
  const left=shuffle(q.items),right=shuffle(q.items);let sel=null;const done=new Set();
  view.innerHTML=header()+`<section class="plate">
    <p class="prompt">Pasangkan kata dengan arti yang tepat.</p>
    <div class="match"><div class="col">${left.map(x=>`<button class="mcard word" data-side="l" data-k="${x[0]}">${x[0]}</button>`).join('')}</div>
    <div class="col">${right.map(x=>`<button class="mcard" data-side="r" data-k="${x[0]}">${x[1]}</button>`).join('')}</div></div>
    <p class="cheer" id="cheer" aria-live="polite"></p></section>`;
  bindBack();
  const cards=$$('.mcard');
  cards.forEach(b=>b.onclick=()=>{
    if(done.has(b.dataset.k)||b.classList.contains('done'))return;
    if(!sel||sel.dataset.side===b.dataset.side){cards.forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');sfx.tap();return}
    const a=sel;sel=null;a.classList.remove('sel');
    if(a.dataset.k===b.dataset.k){
      done.add(b.dataset.k);[a,b].forEach(x=>{x.classList.add('done');x.disabled=true});sfx.good();step();
      cheer(`${rnd(PRAISE)} ${b.dataset.k}`,true);
      if(done.size===q.items.length)later(next,1300);
    }else{S.miss++;sfx.bad();[a,b].forEach(x=>{x.classList.remove('wrong');void x.offsetWidth;x.classList.add('wrong')});cheer('Belum cocok. Coba lagi!',false)}
  });
}

/* susun cerita awal-tengah-akhir */
function renderStory(q){
  const parts=q.s.p.map((t,i)=>({t,i})),order=shuffle(parts);let placed=[];
  const K=['Awal','Tengah','Akhir'];
  view.innerHTML=header()+`<section class="plate">
    <p class="prompt">Susun cerita “<b>${q.s.t}</b>”</p>
    <div class="slots">${K.map((k,i)=>`<div class="slot"><span class="k" style="background:${PARTCOL[i]}">${k}</span><div class="v" data-i="${i}"></div></div>`).join('')}</div>
    <div class="cards" id="cards"></div>
    <div class="actions"><button class="btn ghost" id="reset">↺ Ulangi</button><button class="btn teal" id="readall">🔊 Bacakan</button><button class="btn" id="check" disabled>Periksa ✓</button></div>
    <p class="cheer" id="cheer" aria-live="polite"></p></section>`;
  bindBack();
  const draw=()=>{
    $$('.slot .v').forEach((v,i)=>{const p=placed[i];v.className='v'+(p?' filled':'');v.textContent=p?p.t:'';v.onclick=()=>{if(p&&!$('#check').dataset.lock){placed.splice(i,1);sfx.tap();draw()}}});
    $('#cards').innerHTML=order.filter(p=>!placed.includes(p)).map(p=>`<button class="scard" data-i="${p.i}">${p.t}</button>`).join('');
    $$('.scard').forEach(c=>c.onclick=()=>{sfx.tap();placed.push(parts[+c.dataset.i]);draw()});
    $('#check').disabled=placed.length<3;
  };
  draw();
  $('#reset').onclick=()=>{if($('#check').dataset.lock)return;placed=[];draw()};
  $('#readall').onclick=()=>read((placed.length?placed:parts).map(p=>p.t).join(' '));
  $('#check').onclick=()=>{
    const ok=placed.every((p,i)=>p.i===i);
    if(ok){$('#check').dataset.lock=1;$$('.slot .v').forEach(v=>v.classList.add('good'));$('#check').disabled=true;sfx.good();step();
      cheer(`${rnd(PRAISE)} Ceritanya sudah urut: awal → tengah → akhir.`,true);later(next,2300)}
    else{S.miss++;sfx.bad();$$('.slot .v').forEach((v,i)=>{if(placed[i].i!==i)v.classList.add('bad')});
      cheer('Belum urut. Awal = perkenalan, tengah = masalah atau usaha, akhir = penyelesaian.',false)}
  };
}

/* hasil */
function finish(){
  const lim=['F','C'].includes(S.L.k)?[2,4]:[1,3];
  const st=S.miss<=lim[0]?3:S.miss<=lim[1]?2:1;
  STARS[S.i]=Math.max(STARS[S.i],st);saveStars();
  const i=S.i,nextI=(i+1)%LEVELS.length;
  view.innerHTML=`<section class="plate result">
    <div class="big-stars">${[0,1,2].map(k=>`<span class="${k<st?'on':''}" style="animation-delay:${k*.18}s">★</span>`).join('')}</div>
    <h2>${st===3?'Sempurna!':st===2?'Bagus sekali!':'Terus berlatih, jangan menyerah!'}</h2>
    <p>${S.L.f} ${S.L.t} — ${S.miss===0?'tanpa kesalahan':S.miss+' kali salah'}</p>
    <div class="actions"><button class="btn ghost" id="again">↺ Main lagi</button>
    <button class="btn" id="nxt">Lanjut: ${LEVELS[nextI].t} →</button>
    <button class="btn teal" id="menu">Peta</button></div></section>`;
  sfx.win();confetti();
  $('#again').onclick=()=>start(i);$('#nxt').onclick=()=>start(nextI);$('#menu').onclick=renderMap;
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const E=['⭐','💪','📚','🎈','✏️','🏅'];
  const P=Array.from({length:44},()=>({x:Math.random()*cv.width,y:-30-Math.random()*cv.height*.5,v:2+Math.random()*3.5,r:Math.random()*6,s:18+Math.random()*16,e:rnd(E),w:Math.random()*.1-.05}));
  let t=0;(function f(){cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.y+=p.v;p.r+=p.w;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.font=p.s+'px serif';cx.fillText(p.e,0,0);cx.restore()});
    if(++t<170)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})();
}

$('#brand').onclick=renderMap;
saveStars();renderMap();
</script>
